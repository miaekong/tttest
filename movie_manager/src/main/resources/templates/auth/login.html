<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
</head>
<body>
<div style="max-width:420px;margin:40px auto;">
    <h2>로그인</h2>

    <div th:if="${error}" style="color:red;margin:10px 0;" th:text="${error}"></div>

    <form th:action="@{/login}" method="post" th:object="${loginDTO}">
        <div style="margin-bottom:10px;">
            <label>아이디</label><br>
            <input type="text" th:field="*{username}" placeholder="아이디" style="width:100%;">
        </div>

        <div style="margin-bottom:10px;">
            <label>비밀번호</label><br>
            <input type="password" th:field="*{password}" placeholder="비밀번호" style="width:100%;">
        </div>

        <button type="submit" style="width:100%;padding:10px;">로그인</button>
    </form>

    <div style="margin-top:12px;">
        <a th:href="@{/join}">회원가입</a>
    </div>
</div>
</body>
</html>
