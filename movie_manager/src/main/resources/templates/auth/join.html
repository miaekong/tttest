<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
</head>
<body>
<div style="max-width:420px;margin:40px auto;">
    <h2>회원가입</h2>

    <div th:if="${error}" style="color:red;margin:10px 0;" th:text="${error}"></div>

    <form th:action="@{/join}" method="post" th:object="${joinDTO}">
        <div style="margin-bottom:10px;">
            <label>아이디</label><br>
            <input type="text" th:field="*{username}" placeholder="아이디" style="width:100%;">
        </div>

        <div style="margin-bottom:10px;">
            <label>닉네임</label><br>
            <input type="text" th:field="*{nick}" placeholder="닉네임" style="width:100%;">
        </div>

        <div style="margin-bottom:10px;">
            <label>비밀번호</label><br>
            <input type="password" th:field="*{password}" placeholder="비밀번호" style="width:100%;">
        </div>

        <div style="margin-bottom:10px;">
            <label>비밀번호 확인</label><br>
            <input type="password" th:field="*{passwordConfirm}" placeholder="비밀번호 확인" style="width:100%;">
        </div>

        <button type="submit" style="width:100%;padding:10px;">가입하기</button>
    </form>

    <div style="margin-top:12px;">
        <a th:href="@{/login}">이미 계정이 있어요(로그인)</a>
    </div>
</div>
</body>
</html>
