<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>영화 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- 상단 메뉴 -->
<div th:replace="~{fragments/top :: menu}"></div>

<div class="container mt-4">

    <!-- 제목 / 검색 -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">🎬 영화 목록</h3>
        <span class="text-muted small">검색 · 페이징</span>
    </div>

    <!-- 검색 폼 -->
    <form class="row g-2 mb-4" th:action="@{/movies}" method="get">
        <div class="col-md-6">
            <input type="text"
                   name="q"
                   class="form-control"
                   placeholder="제목 / 감독 / 배우 검색"
                   th:value="${q}">
        </div>

        <div class="col-md-2">
            <input type="number"
                   name="size"
                   min="5"
                   max="50"
                   class="form-control"
                   th:value="${page.size}">
        </div>

        <div class="col-md-4 d-flex gap-2">
            <button class="btn btn-primary" type="submit">검색</button>
            <a class="btn btn-outline-secondary" th:href="@{/movies}">초기화</a>
        </div>
    </form>

    <!-- 영화 카드 목록 -->
    <div class="row row-cols-1 row-cols-md-2 g-3">

        <div class="col" th:each="m : ${page.content}">
            <div class="card h-100 shadow-sm">
                <div class="row g-0">

                    <!-- 포스터 -->
                    <div class="col-4 d-flex align-items-center justify-content-center"
                         style="min-height:130px;">

                        <!-- 이미지 있음 -->
                        <img th:if="${m.posterFileName != null and #strings.length(m.posterFileName) > 0}"
                             th:src="@{/uploads/{file}(file=${m.posterFileName})}"
                             style="width:80px; height:110px; object-fit:cover;
                                    border-radius:8px; border:1px solid #ddd;">

                        <!-- 이미지 없음 -->
                        <div th:if="${m.posterFileName == null or #strings.length(m.posterFileName) == 0}"
                             class="d-flex align-items-center justify-content-center bg-light"
                             style="width:80px; height:110px;
                                    border-radius:8px; border:1px dashed #bbb;
                                    font-size:12px;">
                            No Image
                        </div>
                    </div>

                    <!-- 영화 정보 -->
                    <div class="col-8">
                        <div class="card-body py-2">

                            <h5 class="card-title mb-1">
                                <a th:href="@{|/movies/${m.id}|}"
                                   th:text="${m.title}"
                                   class="text-decoration-none">
                                    title
                                </a>
                                <span class="badge bg-success ms-1"
                                      th:if="${m.featured}">
                                    추천
                                </span>
                            </h5>

                            <div class="small text-muted mb-1">
                                <span th:text="${m.genre}">genre</span>
                                · <span th:text="${m.rating}">rating</span>
                                · <span th:text="${m.runningTime}">0</span>분
                            </div>

                            <div class="small">
                                감독: <b th:text="${m.director}">director</b><br>
                                배우: <span th:text="${m.actors}">actors</span>
                            </div>

                        </div>
                    </div>

                </div>
            </div>
        </div>

    </div>

    <!-- 페이징 -->
    <nav class="mt-4">
        <ul class="pagination justify-content-center">

            <li class="page-item"
                th:classappend="${page.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/movies(q=${q}, page=${page.number-1}, size=${page.size})}">
                    이전
                </a>
            </li>

            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, page.totalPages-1)}"
                th:classappend="${i == page.number} ? 'active'">
                <a class="page-link"
                   th:href="@{/movies(q=${q}, page=${i}, size=${page.size})}"
                   th:text="${i+1}">
                    1
                </a>
            </li>

            <li class="page-item"
                th:classappend="${page.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/movies(q=${q}, page=${page.number+1}, size=${page.size})}">
                    다음
                </a>
            </li>

        </ul>
    </nav>

</div>

</body>
</html>
