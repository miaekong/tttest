<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="menu">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">🎬 MovieManager</a>

            <div class="collapse navbar-collapse show">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/movies}">영화</a></li>
                    <li class="nav-item" th:if="${session.loginRole == 'ADMIN'}">
                        <a class="nav-link" th:href="@{/admin}">관리자</a>
                    </li>
                </ul>

                <div class="d-flex gap-2">
          <span class="text-light align-self-center" th:if="${session.loginNick != null}">
            👤 <b th:text="${session.loginNick}">닉</b>
            (<span th:text="${session.loginRole}">ROLE</span>)
          </span>

                    <a class="btn btn-outline-light btn-sm" th:if="${session.loginNick == null}" th:href="@{/login}">로그인</a>
                    <a class="btn btn-outline-warning btn-sm" th:if="${session.loginNick != null}" th:href="@{/logout}">로그아웃</a>

                    <a class="btn btn-success btn-sm" th:if="${session.loginRole == 'ADMIN'}" th:href="@{/admin/movies/new}">+ 영화등록</a>
                </div>
            </div>
        </div>
    </nav>
</div>
</body>
</html>
