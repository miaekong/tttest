<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{fragments/top :: menu}"></div>

<div class="container" style="max-width:900px;">
    <h3 th:text="${mode == 'create'} ? '영화 등록' : '영화 수정'">영화 폼</h3>

    <form th:action="${mode == 'create'} ? @{/admin/movies/new} : @{|/admin/movies/${movieForm.id}/edit|}"
          method="post" enctype="multipart/form-data" th:object="${movieForm}">

        <div class="row g-3">
            <div class="col-md-8">
                <label class="form-label">제목*</label>
                <input class="form-control" th:field="*{title}">
                <div class="text-danger small" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label">장르</label>
                <input class="form-control" th:field="*{genre}" placeholder="액션/드라마/...">
            </div>

            <div class="col-md-4">
                <label class="form-label">개봉일</label>
                <input class="form-control" type="date" th:field="*{releaseDate}">
            </div>
            <div class="col-md-4">
                <label class="form-label">러닝타임(분)</label>
                <input class="form-control" type="number" th:field="*{runningTime}">
            </div>
            <div class="col-md-4">
                <label class="form-label">관람등급</label>
                <input class="form-control" th:field="*{rating}" placeholder="전체/12/15/청불">
            </div>

            <div class="col-md-6">
                <label class="form-label">감독</label>
                <input class="form-control" th:field="*{director}">
            </div>
            <div class="col-md-6">
                <label class="form-label">배우</label>
                <input class="form-control" th:field="*{actors}" placeholder="배우1, 배우2, ...">
            </div>

            <div class="col-12">
                <label class="form-label">시놉시스</label>
                <textarea class="form-control" rows="4" th:field="*{synopsis}"></textarea>
            </div>

            <div class="col-md-6">
                <label class="form-label">포스터(선택)</label>
                <input class="form-control" type="file" name="poster">
                <div class="small text-muted mt-1" th:if="${existingPoster != null}">
                    기존: <span th:text="${existingPoster}">poster</span>
                </div>
            </div>

            <div class="col-md-3 form-check mt-4">
                <input class="form-check-input" type="checkbox" th:field="*{featured}">
                <label class="form-check-label">추천작(메인 노출)</label>
            </div>

            <div class="col-md-3 form-check mt-4">
                <input class="form-check-input" type="checkbox" th:field="*{archived}">
                <label class="form-check-label">상영 종료(숨김)</label>
            </div>

        </div>

        <div class="mt-4 d-flex gap-2">
            <button class="btn btn-primary" type="submit" th:text="${mode == 'create'} ? '등록' : '저장'">저장</button>
            <a class="btn btn-outline-secondary" th:href="@{/movies}">취소</a>
        </div>

    </form>
</div>

</body>
</html>
