<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{fragments/top :: menu}"></div>

<div class="container">
    <h3>관리자 대시보드</h3>

    <div class="row g-3 mt-1">
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <div class="text-muted">상영중 영화 수</div>
                    <h2 th:text="${countMovies}">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <div class="text-muted">추천작 수</div>
                    <h2 th:text="${countFeatured}">0</h2>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-3">
        <a class="btn btn-success" th:href="@{/admin/movies/new}">+ 영화 등록</a>
        <a class="btn btn-outline-secondary" th:href="@{/movies}">영화 목록</a>
    </div>
</div>

</body>
</html>
